services:
  mariadb:
    image: mariadb:11
    container_name: crud-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: crud_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - crud-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: crud-app
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/crud_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    networks:
      - crud-network

volumes:
  mariadb_data:

networks:
  crud-network:
    driver: bridge
